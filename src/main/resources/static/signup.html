<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        input { margin-bottom: 10px; padding: 8px; width: 250px; display: block; }
        button { padding: 10px 20px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
<h2>📝 회원가입</h2>
<input type="email" id="email" placeholder="이메일 (example@test.com)">
<input type="text" id="nickname" placeholder="닉네임 (로그인 아이디로 사용)">
<input type="password" id="password" placeholder="비밀번호">
<button onclick="signUp()">가입하기</button>

<script>
    async function signUp() {
        const data = {
            email: document.getElementById('email').value,
            nickname: document.getElementById('nickname').value,
            password: document.getElementById('password').value
        };
        const res = await fetch('/api/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        alert(await res.text());
    }
</script>
</body>
</html>
