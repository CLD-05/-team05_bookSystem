<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1C1917;
      letter-spacing: -0.3px;
    }

    .login-box {
      width: 280px;
      border: 1.5px solid #D6D3D1;
      border-radius: 14px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .login-box input {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13.5px;
      color: #1C1917;
      background: #FFFFFF;
      border: 1.5px solid #D6D3D1;
      border-radius: 8px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      width: 100%;
    }

    .login-box input::placeholder {
      color: #A8A29E;
    }

    .login-box input:focus {
      border-color: #F59E0B;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
    }

    .btn-login {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: #F59E0B;
      border: none;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.18s, transform 0.12s;
      margin-top: 2px;
    }

    .btn-login:hover {
      background: #D97706;
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-msg {
      font-size: 12.5px;
      color: #DC2626;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <h1>관리자 로그인</h1>
    <div class="login-box">
      <input type="text"     id="input-id" placeholder="아이디를 입력해주세요." />
      <input type="password" id="input-pw" placeholder="비밀번호를 입력해주세요." />
      <button class="btn-login" onclick="doLogin()">로그인</button>
    </div>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <script>

    async function doLogin() {
  const id  = document.getElementById('input-id').value.trim();
  const pw  = document.getElementById('input-pw').value;
  const msg = document.getElementById('error-msg');
  const btn = document.querySelector('.btn-login');

  if (!id || !pw) {
    msg.textContent = "아이디와 비밀번호를 모두 입력해주세요.";
    return;
  }

  btn.textContent = "로그인 중...";
  btn.disabled = true;
  msg.textContent = "";

  try {
    const response = await fetch("http://localhost:8080/api/users/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ adminId: id, password: pw })
    });

    if (response.ok) {
      window.location.href = "admin_index.html";
    } else {
      msg.textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
      document.getElementById('input-pw').value = "";
      document.getElementById('input-pw').focus();
    }

  } catch (e) {
    msg.textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";
  } finally {
    btn.textContent = "로그인";
    btn.disabled = false;
  }
}

['input-id', 'input-pw'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});
  </script>

</body>
</html>
