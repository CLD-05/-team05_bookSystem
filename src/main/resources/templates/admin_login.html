<!DOCTYPE html>
<html lang="ko" xmlns:th="
http://www.thymeleaf.org/
">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 로그인</title>
    <link rel="preconnect" href="
https://fonts.googleapis.com/
">
    <link href="
https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap
" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1C1917;
            letter-spacing: -0.3px;
        }

        .login-box {
            width: 280px;
            border: 1.5px solid #D6D3D1;
            border-radius: 14px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .login-box input {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13.5px;
            color: #1C1917;
            background: #FFFFFF;
            border: 1.5px solid #D6D3D1;
            border-radius: 8px;
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
            width: 100%;
        }

        .login-box input::placeholder {
            color: #A8A29E;
        }

        .login-box input:focus {
            border-color: #F59E0B;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
        }

        .btn-login {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: #F59E0B;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.18s, transform 0.12s;
            margin-top: 2px;
        }

        .btn-login:hover {
            background: #D97706;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            font-size: 12.5px;
            color: #DC2626;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <h1>관리자 로그인</h1>

    <!-- 로그인 form → 백엔드 POST /user/login -->
    <form th:action="@{/user/login}" method="post" class="login-box">

        <input type="text"
               name="userId"
               placeholder="아이디를 입력해주세요."
               required />

        <input type="password"
               name="password"
               placeholder="비밀번호를 입력해주세요."
               required />

        <button type="submit" class="btn-login">로그인</button>
    </form>

    <!-- 로그인 실패 시 백엔드에서 error 파라미터 전달 -->
    <p class="error-msg"
       th:if="${param.error}"
       th:text="${param.error == 'invalid' ?
                 '아이디 또는 비밀번호가 올바르지 않습니다.' :
                 '관리자 계정이 아닙니다.'}">
    </p>

</div>

</body>
</html>
