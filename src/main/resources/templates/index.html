<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header</title>
    <link rel="preconnect" href="
https://fonts.googleapis.com/
">
    <link rel="preconnect" href="
https://fonts.gstatic.com/
" crossorigin>
    <link href="
https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap
" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --bg: #FFFFFF;
            --text: #1C1917;
            --text-muted: #78716C;
            --border: #E7E5E4;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: #FFFFFF;
            border-bottom: 1.5px solid var(--border);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
        }

        .logo-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 8px;
            transition: background 0.18s, color 0.18s;
        }

        nav a:hover {
            background: #F5F5F4;
            color: var(--text);
        }

        nav a.btn-login {
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        nav a.btn-logout {
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        nav a.btn-mypage {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        nav a.btn-mypage:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 16px;
            background: var(--border);
            margin: 0 2px;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 100px;
        }

        .search-section {
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
            width: 65%;
        }

        .search-field {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 400px;
        }

        .search-field label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            padding-left: 30px;
        }

        .search-field input {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            color: var(--text);
            background: #FAF9F7;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            width: 250px;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }

        .search-field input:focus {
            border-color: var(--border-focus);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
        }

        .search-field input::placeholder {
            color: #C4B9B3;
        }

        .btn-search {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 20px;
            padding: 9px 28px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.28);
            margin-left: auto;
        }

        .btn-search:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.38);
            transform: translateY(-1px);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .popular-book {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
            gap: 100px;
        }

        .popular-book a {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            flex-direction: column;
            /* padding-left: 40px;
            padding-right: 40px; */
            text-decoration: none;
        }

        .book-info {
            margin-top: 10px;
            color: black;
        }

        .popular-book img {
            border-radius: 8px;
            width: 100px;
            height: 150px;
        }

        .book-list-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 85%;
            margin: 30px auto;
            border: none;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .book-list-table th {
            background-color: #f1f3f5;
            color: #333;
            padding: 15px;
            font-size: 1.1rem;

        }

        .book-list-table td {
            padding: 12px;
            color: #555;
            border-bottom: 1px solid #f1f1f1;
            /* 세로줄 대신 연한 가로줄 */
        }

        /* 마지막 줄은 가로줄을 없애서 깔끔하게 마무리 */
        .book-list-table tr:last-child td {
            border-bottom: none;
        }

        .book-list-table thead tr:first-child th:first-child {
            border-top-left-radius: 12px;
        }

        .book-list-table thead tr:first-child th:last-child {
            border-top-right-radius: 12px;
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" th:href="@{/}">
            <span class="logo-icon">📚</span>
            <span class="logo-text">도서관리시스템</span>
        </a>
        <nav>
            <a th:if="${session.user == null}" th:href="@{/login}" class="btn-login">로그인</a>

            <th:block th:if="${session.user != null}">
                <a href="/logout" class="btn-logout">로그아웃</a>
                <a th:href="@{/mypage}" class="btn-mypage">마이페이지</a>
            </th:block>

        </nav>
    </header>
    <main>
        <form action="/search" method="GET" class="search-section">
            <div class="search-field">
                <label for="input-title">책제목:</label>
                <input type="text" name="title" id="input-title" placeholder="제목 입력" />
            </div>
            <div class="search-field">
                <label for="input-author">저자명:</label>
                <input type="text" name="author" id="input-author" placeholder="저자 입력" />
            </div>
            <button type="submit" class="btn-search">검색</button>
        </form>
    </main>
    <section style="margin: 0 auto;">
        <h2 style="margin-left: 200px;">인기도서</h2>
        <div class="popular-book">
            <a th:each="book, stat : ${books}" th:if="${stat.index < 4}" th:href="@{/book/detail/{id}(id=${book.id})}">
                <div>
                    <img th:src="${book.imageUrl}" alt="도서 이미지">
                </div>
                <div class="book-info">
                    <p th:text="${book.title}">책 제목</p>
                    <p th:text="${book.author}">저자</p>
                    <p th:text="${book.description}">한줄 설명</p>
                </div>
            </a>

            <a href="book_detail.html">
                <div>
                    <img src="https://image.aladin.co.kr/product/38595/26/cover200/k782136276_3.jpg" alt="">
                </div>
                <div class="book-info">
                    <p>책 제목</p>
                    <p>저자</p>
                    <p>한줄 설명</p>
                </div>
            </a>


            <hr>
        </div>
    </section>


    <script>
        // 1. 검색 버튼 클릭 시 실행되는 함수
        function searchBooks() {
            const titleQ = document.getElementById('input-title').value.trim().toLowerCase();
            const authorQ = document.getElementById('input-author').value.trim().toLowerCase();

            // MOCK_BOOKS가 정의되어 있어야 작동합니다. 
            // 만약 서버에서 데이터를 가져와 검색하고 싶다면 fetch를 사용해야 합니다.
            if (typeof MOCK_BOOKS !== 'undefined') {
                const filtered = MOCK_BOOKS.filter(b => {
                    const matchTitle = !titleQ || b.title.toLowerCase().includes(titleQ);
                    const matchAuthor = !authorQ || b.author.toLowerCase().includes(authorQ);
                    return matchTitle && matchAuthor;
                });
                // 검색 결과를 인기도서 영역에 표시 (필요에 따라 변경 가능)
                renderPopularBooks(filtered);
            } else {
                console.warn("MOCK_BOOKS 데이터가 없습니다.");
            }
        }

        // 2. 페이지가 로드되자마자 실행되는 설정
        window.onload = function () {
            fetchPopularBooks();
        };

        // 3. 서버에서 데이터를 가져와 인기도서(TOP 4) 정렬 후 출력
        async function fetchPopularBooks() {
            try {
                // 스프링 부트 서버의 전체 도서 API 호출
                const response = await fetch('http://localhost:8080/api/books/all');

                if (!response.ok) throw new Error("서버 연결 실패");

                let books = await response.json();

                // 대출 횟수(rentalHitCount)가 높은 순으로 정렬 (Desc)
                // 데이터가 없는 경우를 대비해 || 0 처리
                books.sort((a, b) => (b.rentalHitCount || 0) - (a.rentalHitCount || 0));

                // 상위 4개만 추출
                const popularBooks = books.slice(0, 4);

                // 화면에 그리기
                renderPopularBooks(popularBooks);
            } catch (error) {
                console.error("데이터 로드 중 오류 발생:", error);
                // 에러 시 사용자에게 알림을 주거나 기본 메시지 출력 가능
            }
        }

        // 4. 데이터를 받아 HTML 카드로 만들어 화면에 주입(Injection)하는 함수
        function renderPopularBooks(books) {
            const container = document.querySelector('.popular-book');
            if (!container) return;

            container.innerHTML = ''; // 기존의 정적(가짜) 데이터 비우기

            if (books.length === 0) {
                container.innerHTML = '<p>표시할 도서가 없습니다.</p>';
                return;
            }

            books.forEach(book => {
                const bookHtml = `
                <a href="/book/detail/${book.bookId}">
                    <div>
                        <img src="${book.imageUrl || 'https://via.placeholder.com/150'}" alt="도서 이미지">
                    </div>
                    <div class="book-info">
                        <p><strong>${book.title}</strong></p>
                        <p>${book.author}</p>
                        <p style="font-size: 12px; color: #78716C;">대출 횟수: ${book.rentalHitCount || 0}회</p>
                    </div>
                </a>
            `;
                container.insertAdjacentHTML('beforeend', bookHtml);
            });
        }
    </script>
</body>

</html>
