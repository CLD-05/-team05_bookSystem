<!DOCTYPE html>
<html lang="ko" xmlns:th="
http://www.thymeleaf.org/
">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>관리자 메인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --border: #D6D3D1;
            --text: #1C1917;
            --text-muted: #78716C;
            --bg: #F5F5F4;
            --sidebar-bg: #E5E5E5;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: #FFFFFF;
            border-bottom: 1.5px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { font-size: 28px; line-height: 1; }
        .logo-text { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
        header nav { display: flex; align-items: center; gap: 6px; }
        header nav a {
            text-decoration: none; font-size: 14px; font-weight: 500;
            color: var(--text-muted); padding: 7px 16px; border-radius: 8px;
            transition: background 0.18s, color 0.18s;
        }
        header nav a:hover { background: #F5F5F4; color: var(--text); }
        header nav a.btn-logout { border: 1.5px solid var(--border); }

        /* ── Layout ── */
        .layout {
            display: flex;
            flex: 1;
        }

        /* ── Sidebar ── */
        aside {
            width: 220px;
            background: var(--sidebar-bg);
            flex-shrink: 0;
            padding-top: 20px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 20%;
        }

        .sidebar-menu a {
            display: block;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            padding: 14px 24px;
            background: transparent;
            transition: background 0.15s, color 0.15s;
            border: 1px solid #D1CEC9;
            width: 100%;
            box-sizing: border-box;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: var(--primary);
            color: #fff;
        }

        /* ── Content ── */
        .content {
            flex: 1;
            padding: 40px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 30px;
        }

        /* ── Table ── */
        .book-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .book-table th {
            background: #F8F8F8;
            padding: 14px 20px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }

        .book-table td {
            padding: 14px 20px;
            font-size: 14px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
        }

        .book-table tr:last-child td {
            border-bottom: none;
        }

        .book-table tr:hover {
            background: #FAFAFA;
        }

        .btn-delete {
            background: #EF4444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-delete:hover {
            background: #DC2626;
        }

        .btn-add-book {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: background 0.15s;
        }

        .btn-add-book:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div th:replace="~{header_admin :: header}"></div>

<div class="layout">
    <aside>
        <nav class="sidebar-menu">
            <a th:href="@{/admin/books}" class="active">도서 관리</a>
            <a th:href="@{/admin/users}">사용자 관리</a>
        </nav>
    </aside>

    <div class="content">
        <div class="page-title">📚 도서 관리 목록</div>

        <div th:if="${param.error}" class="error-msg" th:text="${param.error}" style="color: #EF4444; background: #FEF2F2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-weight: 500;">
            에러 메시지
        </div>

        <a th:href="@{/admin/books/add}" class="btn-add-book">+ 신규 도서 등록</a>

        <table class="book-table">
            <thead>
                <tr>
                    <th>도서 ID</th>
                    <th>제목</th>
                    <th>저자</th>
                    <th>상태</th>
                    <th>대출 횟수</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.bookId}">1</td>
                    <td th:text="${book.title}">제목</td>
                    <td th:text="${book.author}">저자</td>
                    <td>
                        <span th:text="${book.status == 'AVAILABLE' ? '대여 가능' : '대여 중'}"
                              th:style="${book.status == 'AVAILABLE' ? 'color: #059669; font-weight: 600;' : 'color: #DC2626; font-weight: 600;'}">
                        </span>
                    </td>
                    <td th:text="${book.rentalHitCount + '회'}">0회</td>
                    <td>
                        <form th:action="@{/admin/books/delete/{id}(id=${book.bookId})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <button type="submit" class="btn-delete">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">등록된 도서가 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
