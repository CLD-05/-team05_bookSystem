<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 550px; padding: 50px 40px; border: 2px solid #E9E7E6; border-radius: 20px; text-align: center; }
        .form-control { border-radius: 20px !important; border: 1px solid #E9E7E6; padding: 12px 20px; margin-bottom: 15px; }
        .btn-orange { background-color: #F59E0B; border: none; border-radius: 15px; padding: 12px; width: 100%; font-weight: bold; }
        .auth-links { font-size: 0.9rem; margin-top: 25px; }
        .auth-links a { color: blue; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 class="mb-5 fw-bold">아이디 찾기</h2>
        <form action="/user/find-id" method="post">
            <input type="text" name="nickname" class="form-control" placeholder="닉네임을 입력해주세요." required>
            <input type="email" name="email" class="form-control" placeholder="이메일을 입력해주세요." required>
            <button type="submit" class="btn btn-orange">아이디 찾기</button>
        </form>
        <div class="auth-links">
            <a href="/user/reset-password">비밀번호 찾기</a> | <a href="/user/login">로그인 하러 가기</a>
        </div>
    </div>
</body>
</html>
