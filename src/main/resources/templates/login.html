<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 버튼등(주황색) = F59E0B
    텍스트 영역 배경(옅은회색) = FAF9F7
    기타 라인들 =(짙은회색?) = -->
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 500px; padding: 50px 40px; border: 2px solid #E9E7E6; border-radius: 20px; text-align: center; }
        .form-control { border-radius: 20px !important; border: 1px solid #E9E7E6; padding: 12px 20px; margin-bottom: 15px; }
        .btn-orange { background-color: #F59E0B; border: none; border-radius: 10px; padding: 12px; width: 100%; font-weight: bold; }
        .auth-links { font-size: 0.9rem; margin-top: 25px; }
        .auth-links a { color: blue; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 class="mb-5 fw-bold">로그인</h2>
        <form>
            <input type="text" class="form-control" placeholder="아이디를 입력해주세요.">
            <input type="password" class="form-control" placeholder="비밀번호를 입력해주세요.">
            <button type="submit" class="btn btn-orange">로그인</button>
        </form>
        <div class="auth-links">
            <a href="id_search.html">아이디 찾기</a> | <a href="pw_reset1.html">비밀번호 찾기</a>
            <p class="mt-3"><a href="sign_up.html" class="text-dark">회원 가입</a></p>
        </div>
    </div>
</body>
</html>
