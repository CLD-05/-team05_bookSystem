<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { background-color: #fff; }
        .signup-container { max-width: 950px; margin: 50px auto; padding: 50px; border: 2px solid #E9E7E6; border-radius: 20px; }
        .form-control, .form-select { border-radius: 20px !important; border: 1px solid #E9E7E6; padding: 10px 20px; }
        .pw-group { position: relative; }
        .pw-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; }
        /* .btn-signup { background-color: #F59E0B; border: none; padding: 12px 45px; font-weight: bold; border-radius: 5px; color: #000; } */
        .btn-signup { 
            background-color: #F59E0B !important; 
            color: #E9E7E6 !important;             
            border: none !important;            
            padding: 12px 45px; 
            font-weight: bold; 
            border-radius: 5px; 
            transition: none !important; /* 마우스 올려도 부드럽게 변하는 효과 제거 */
            box-shadow: none !important; /* 클릭 시 그림자 제거 */
        }
        .form-label { font-weight: bold; margin-bottom: 0; white-space: nowrap; }
        .info-text { font-size: 0.85rem; color: #888; text-align: right; }
        
        /* --- 캡차 스타일 --- */
        #captchaContainer { 
            position: relative; width: 320px; height: 160px; 
            background: url('https://picsum.photos/320/160') no-repeat; 
            margin: 0 auto; border-radius: 10px; overflow: hidden;
        }
        #puzzlePiece {
            position: absolute; width: 50px; height: 50px;
            background-image: inherit; background-size: 320px 160px;
            border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            z-index: 10; cursor: grab; border-radius: 5px;
        }
        #puzzleGap {
            position: absolute; width: 50px; height: 50px;
            background-color: rgba(0,0,0,0.5); border: 2px dashed #fff; border-radius: 5px;
        }
        .slider-container { width: 320px; margin: 20px auto; position: relative; height: 40px; background: #eee; border-radius: 20px; }
        #captchaSlider { width: 100%; cursor: pointer; }
        .modal-content { border-radius: 20px; border: 2px solid #000; }
    </style>
</head>
<body>
    <div class="container text-center mt-5">
        <h2 class="mb-5 fw-bold">회원 가입</h2>
        <div class="signup-container text-start">
            <form id="signupForm" onsubmit="return startCaptcha(event)">
                <div class="row mb-3 align-items-center">
                    <label class="col-sm-3 form-label">● 아이디 *</label>
                    <div class="col-sm-6"><input type="text" id="userId" class="form-control"></div>
                    <div class="col-sm-3 info-text">4자 이상/ 특수문자 제외</div>
                </div>
                <!-- <div class="row mb-3 align-items-center">
                    <label class="col-sm-3 form-label">● 이메일 *</label>
                    <div class="col-sm-3"><input type="text" id="email1" class="form-control"></div>
                    <div class="col-sm-1 text-center">@</div>
                    <div class="col-sm-2"><input type="text" id="email2" class="form-control"></div>
                    <div class="col-sm-3">
                        <select class="form-select" onchange="document.getElementById('email2').value=this.value">
                            <option value="">직접 입력 ▼</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                        </select>
                    </div>
                </div> -->
                <div class="row mb-3 align-items-center">
                    <label class="col-sm-3 form-label">● 이메일 *</label>
                    <div class="col-sm-3"><input type="text" id="email1" class="form-control" placeholder="example"></div>
                    <div class="col-auto px-0 text-center" style="width: 10px;">@</div>
                    <div class="col-sm-2"><input type="text" id="email2" class="form-control" placeholder="naver.com"></div>
                    <div class="col-sm-2">
                        <select class="form-select" id="emailSelect" onchange="document.getElementById('email2').value=this.value">
                            <option value="">직접 입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3 align-items-center">
                    <label class="col-sm-3 form-label">● 비밀번호 *</label>
                    <div class="col-sm-6 pw-group">
                        <input type="password" id="pw" class="form-control">
                        <span class="material-symbols-outlined pw-toggle" onclick="togglePassword('pw', this)">visibility</span>
                    </div>
                    <div class="col-sm-3 info-text">8자 이상, 대/소문자/숫자 조합</div>
                </div>
                <div class="row mb-3 align-items-center">
                    <label class="col-sm-3 form-label">● 비밀번호 재입력 *</label>
                    <div class="col-sm-6 pw-group">
                        <input type="password" id="pwConfirm" class="form-control">
                        <span class="material-symbols-outlined pw-toggle" onclick="togglePassword('pwConfirm', this)">visibility</span>
                    </div>
                </div>
                <div class="row mb-4 align-items-center">
                    <label class="col-sm-3 form-label">● 닉네임 *</label>
                    <div class="col-sm-6"><input type="text" id="nickname" class="form-control"></div>
                </div>
                <div class="text-center mt-5"><button type="submit" class="btn btn-signup">가입하기</button></div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="modal-body fs-5 fw-bold" id="modalMsg"></div>
                <div class="mt-3"><button type="button" class="btn btn-dark w-50" onclick="closeModal()">확인</button></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="captchaModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center">
                <h5 class="fw-bold mb-3">보안 검증</h5>
                <p class="small text-muted">슬라이더를 밀어 퍼즐을 완성하세요.</p>
                <div id="captchaContainer">
                    <div id="puzzleGap"></div>
                    <div id="puzzlePiece"></div>
                </div>
                <div class="slider-container">
                    <input type="range" id="captchaSlider" min="0" max="270" value="0">
                </div>
                <div id="captchaStatus" class="mt-2 fw-bold"></div>
                <div class="mt-3">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="initCaptcha()">새로고침</button>
                    <button type="button" class="btn btn-dark btn-sm" data-bs-dismiss="modal">취소</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const alertModal = new bootstrap.Modal(document.getElementById('alertModal'));
        const captchaModal = new bootstrap.Modal(document.getElementById('captchaModal'));
        let targetId = "";
        let gapPos = { x: 0, y: 0 };

        // 1. 가입하기 클릭 시 검증 로직
        function startCaptcha(e) {
            e.preventDefault();
            const userId = document.getElementById('userId').value.trim();
            const email1 = document.getElementById('email1').value.trim();
            const email2 = document.getElementById('email2').value.trim();
            const pw = document.getElementById('pw').value;
            const pwConfirm = document.getElementById('pwConfirm').value;
            const nickname = document.getElementById('nickname').value.trim();

            if (!userId) return showModal("아이디를 입력해주세요.", "userId");
            if (!email1 || !email2) return showModal("이메일을 정확히 입력해주세요.", "email1");
            const pwRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!pwRegex.test(pw)) return showModal("비밀번호 조건을 확인해주세요.", "pw");
            if (pw !== pwConfirm) return showModal("비밀번호가 일치하지 않습니다.", "pwConfirm");
            if (!nickname) return showModal("닉네임을 입력해주세요.", "nickname");

            // 모든 검증 통과 시 캡차 실행
            initCaptcha();
            captchaModal.show();
        }

        // 2. 캡차 초기화 (랜덤 위치 생성)
        function initCaptcha() {
            const piece = document.getElementById('puzzlePiece');
            const gap = document.getElementById('puzzleGap');
            const slider = document.getElementById('captchaSlider');
            const status = document.getElementById('captchaStatus');
            
            slider.value = 0;
            status.innerText = "";
            
            // 랜덤 위치 (우측 50% 영역 내)
            gapPos.x = Math.floor(Math.random() * 120) + 150; 
            gapPos.y = Math.floor(Math.random() * 80) + 20;
            
            gap.style.left = gapPos.x + "px";
            gap.style.top = gapPos.y + "px";
            
            piece.style.left = "0px";
            piece.style.top = gapPos.y + "px";
            piece.style.backgroundPosition = `-${gapPos.x}px -${gapPos.y}px`;
        }

        // 3. 슬라이더 조작 이벤트
        document.getElementById('captchaSlider').addEventListener('input', function(e) {
            const val = e.target.value;
            document.getElementById('puzzlePiece').style.left = val + "px";
        });

        document.getElementById('captchaSlider').addEventListener('change', function(e) {
            const val = parseInt(e.target.value);
            const status = document.getElementById('captchaStatus');
            
            // 오차 범위 5px 허용
            if (Math.abs(val - gapPos.x) <= 5) {
                status.innerText = "검증 성공! 잠시 후 이동합니다.";
                status.style.color = "green";
                setTimeout(() => {
                    location.href = "sign_up_result.html";
                }, 1000);
            } else {
                status.innerText = "실패! 다시 시도하세요.";
                status.style.color = "red";
                setTimeout(initCaptcha, 500);
            }
        });

        function showModal(msg, id) {
            document.getElementById('modalMsg').innerText = msg;
            targetId = id;
            alertModal.show();
        }

        function closeModal() {
            alertModal.hide();
            setTimeout(() => { document.getElementById(targetId)?.focus(); }, 400);
        }

        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
            iconElement.innerText = input.type === "password" ? "visibility" : "visibility_off";
        }
    </script>
</body>
</html>
