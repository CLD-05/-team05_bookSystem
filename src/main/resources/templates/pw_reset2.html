<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box { width: 550px; padding: 50px 40px; border: 2px solid #E9E7E6; border-radius: 20px; text-align: center; }
        .form-control { border-radius: 20px !important; border: 1px solid #E9E7E6; padding: 12px 20px; margin-bottom: 15px; }
        .btn-orange { background-color: #F59E0B; border: none; border-radius: 15px; padding: 12px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 class="mb-5 fw-bold">비밀번호 재설정</h2>
        <form th:action="@{/user/reset-password}" method="post">
            <input type="password" name="newPassword" class="form-control" placeholder="비밀번호를 입력해주세요.">
            <input type="password" class="form-control" placeholder="다시 한번 입력해주세요.">
            <button type="submit" class="btn btn-orange">비밀번호 재설정</button>
        </form>
    </div>
</body>
</html>
