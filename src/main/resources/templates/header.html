<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Header</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #F59E0B;
      --primary-dark: #D97706;
      --bg: #FFFFFF;
      --text: #1C1917;
      --text-muted: #78716C;
      --border: #E7E5E4;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: #FFFFFF;
      border-bottom: 1.5px solid var(--border);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));
    }

    .logo-text {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    nav a {
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 8px;
      transition: background 0.18s, color 0.18s;
    }

    nav a:hover {
      background: #F5F5F4;
      color: var(--text);
    }

    nav a.btn-logout {
      border: 1.5px solid var(--border);
      color: var(--text-muted);
    }

    nav a.btn-mypage {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    nav a.btn-mypage:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    .divider {
      width: 1px;
      height: 16px;
      background: var(--border);
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">
      <span class="logo-icon">📚</span>
      <span class="logo-text">도서관리시스템</span>
    </a>
    <nav>
      <a href="index.html" class="btn-logout">로그아웃</a>
      <a href="mypage.html" class="btn-mypage">마이페이지</a>
    </nav>
  </header>
</body>
</html>
