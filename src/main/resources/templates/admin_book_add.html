<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>도서 추가</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --border: #D6D3D1;
            --text: #1C1917;
            --text-muted: #78716C;
            --bg: #F5F5F4;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: #FFFFFF;
            border-bottom: 1.5px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-icon { font-size: 28px; line-height: 1; }
        .logo-text { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
        nav { display: flex; align-items: center; gap: 6px; }
        nav a {
            text-decoration: none; font-size: 14px; font-weight: 500;
            color: var(--text-muted); padding: 7px 16px; border-radius: 8px;
            transition: background 0.18s, color 0.18s;
        }
        nav a:hover { background: #F5F5F4; color: var(--text); }
        nav a.btn-logout { border: 1.5px solid var(--border); }
        nav a.btn-mypage { background: var(--primary); color: #fff; font-weight: 600; }
        nav a.btn-mypage:hover { background: var(--primary-dark); }
        .divider { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }

        /* ── Main ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px 60px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 36px;
            letter-spacing: -0.3px;
        }

        .form-wrap {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            width: 100%;
            max-width: 600px;
        }

        /* ── Image Upload ── */
        .img-upload {
            width: 130px;
            height: 170px;
            flex-shrink: 0;
            background: var(--bg);
            border: 1.5px dashed var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: border-color 0.18s, background 0.18s;
            overflow: hidden;
            position: relative;
        }

        .img-upload:hover {
            border-color: var(--primary);
            background: #FEF9EC;
        }

        .img-upload input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .img-upload img#preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            border-radius: 8px;
        }

        .img-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }

        .img-placeholder .icon { font-size: 30px; opacity: 0.4; }
        .img-placeholder span { font-size: 12px; color: var(--text-muted); }

        /* ── Fields ── */
        .fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .field-row label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            width: 68px;
            flex-shrink: 0;
        }

        .field-row input,
        .field-row textarea {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13.5px;
            color: var(--text);
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            padding: 9px 13px;
            flex: 1;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
            resize: none;
        }

        .field-row input:focus,
        .field-row textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.12);
        }

        .field-row textarea {
            height: 72px;
            line-height: 1.5;
        }

        /* ── Submit ── */
        .submit-wrap {
            margin-top: 44px;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
        }

        .btn-submit {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            padding: 14px 0;
            width: 260px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
            box-shadow: 0 2px 10px rgba(245,158,11,0.28);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(245,158,11,0.36);
        }

        .btn-submit:active { transform: translateY(0); }

        /* ── Error msg ── */
        .error-msg {
            font-size: 12.5px;
            color: #DC2626;
            text-align: center;
            min-height: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div th:replace="~{header_admin :: header}"></div>

<main>
    <div class="page-title">도서 관리</div>

    <form th:action="@{/admin/books/register}" method="post" enctype="multipart/form-data">
        <div class="form-wrap">
            <div class="img-upload" id="img-upload-box">
                <input type="file" name="imageFile" id="img-input" accept="image/*" onchange="previewImage(event)" />
                <img id="preview" alt="미리보기" />
                <div class="img-placeholder" id="img-placeholder">
                    <span class="icon">🖼️</span>
                    <span>img</span>
                    <span style="font-size:11px;color:#B45309;">클릭하여 추가</span>
                </div>
            </div>

            <div class="fields">
                <div class="field-row">
                    <label for="input-title">제목</label>
                    <input type="text" id="input-title" name="title" placeholder="책 제목 입력" required />
                </div>
                <div class="field-row">
                    <label for="input-author">저자</label>
                    <input type="text" id="input-author" name="author" placeholder="저자명 입력" required />
                </div>
                <div class="field-row">
                    <label for="input-desc">한줄 설명</label>
                    <textarea id="input-desc" name="description" placeholder="한줄 설명 입력"></textarea>
                </div>
            </div>
        </div>

        <div class="submit-wrap">
            <button type="submit" class="btn-submit">신규 도서 등록</button>
        </div>
    </form>
    <p class="error-msg" th:if="${param.error}" th:text="${param.error == 'fail' ? '등록에 실패했습니다. 다시 시도해주세요.' : ''}"></p>
</main>

<script>
    // ── 이미지 미리보기 ───────────────────────────────────
    function previewImage(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(ev) {
            const preview = document.getElementById('preview');
            preview.src = ev.target.result;
            preview.style.display = 'block';
            document.getElementById('img-placeholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }

    // ── 도서 등록 ─────────────────────────────────────────
    // submitBook() 함수는 Form Post 방식으로 변경되었으므로 삭제되었습니다.

    // JS로 헤더를 불러오던 fetch 코드는 타임리프가 대신 처리하므로 삭제했습니다!
</script>

</body>
</html>
