<!DOCTYPE html>
<html lang="en" xmlns="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mypage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #F59E0B;
            --primary-dark: #D97706;
            --bg: #FFFFFF;
            --text: #1C1917;
            --text-muted: #78716C;
            --border: #E7E5E4;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            background: #FFFFFF;
            border-bottom: 1.5px solid var(--border);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.12));
        }

        .logo-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        nav a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 8px;
            transition: background 0.18s, color 0.18s;
        }

        nav a:hover {
            background: #F5F5F4;
            color: var(--text);
        }

        nav a.btn-logout {
            border: 1.5px solid var(--border);
            color: var(--text-muted);
        }

        nav a.btn-mypage {
            background: var(--primary);
            color: #fff;
            font-weight: 600;
        }

        nav a.btn-mypage:hover {
            background: var(--primary-dark);
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 16px;
            background: var(--border);
            margin: 0 2px;
        }

        section {
            text-align: center;
            padding-top: 20px;
            margin-top: 0 auto;
        }

        .user-info {
            border: solid 2px;
            border-radius: 20px;
            width: 600px;
            height: 130px;
            margin: 0 auto;
        }

        .user-info p {
            font-size: 20px;
            margin-left: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .rent-info {
            border: solid 2px;
            border-radius: 20px;
            width: 600px;
            min-height: 180px;
            margin: 0 auto;
            overflow: auto;
        }

        .rent-header {
            display: flex;
            font-size: 20px;
            justify-content: space-around;
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--border);
            background-color: darkgray;
        }

        .rent-row {
            display: flex;
            padding: 5px;
            border-bottom: 1px solid var(--border);
        }

        .rent-row span {
            flex: 1;
            text-align: center;
            font-size: 18px;
        }

        .btn-delete {
            color: gray;
            text-decoration: none;
        }

        .all-rent-info {
            display: flex;
            flex-direction: column;
            border: solid 2px;
            border-radius: 20px;
            width: 600px;
            height: 240px;
            margin: 0 auto;
            overflow: auto;
        }

        .all-rent-header {
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            padding: 10px 0;
            border-bottom: 2px solid var(--border);
            background-color: darkgray;
        }

        .all-rent-row {
            display: flex;
            padding: 5px;
            border-bottom: 1px solid var(--border);
        }

        .all-rent-row span {
            flex: 1;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" th:href="@{/}">
            <span class="logo-icon">📚</span>
            <span class="logo-text">도서관리시스템</span>
        </a>
        <nav>
            <a href="/logout" class="btn-logout">로그아웃</a>
            <a th:href="@{/mypage}" class="btn-mypage">마이페이지</a>
        </nav>
    </header>

    <section>
        <h2 style="margin-bottom: 30px;">
            <span th:text="${user.nickname}">#이름</span>님의 회원정보
        </h2>
        <div class="user-info">
            <p><strong>닉네임:</strong> <span th:text="${user.nickname}">###</span></p>
            <p><strong>이메일:</strong> <span th:text="${user.email}">###</span></p>
        </div>

        <br>

        <h4 th:inline="text" style="margin-right: 450px; margin-bottom: 10px;">대여 상태
            (남은 권수 [[${user.current_rental_count}]] / [[${user.max_rental_limit}]])</h4>
        <div class="rent-info">
            <div class="rent-header">
                <span><strong>책 제목</strong></span>
                <span><strong>저자명</strong></span>
                <span><strong>대여일</strong></span>
                <span><strong>반납일</strong></span>
            </div>
            <div class="rent-row" th:each="book : ${rentedBooks}">
                <span th:text="${book.title}">#책 제목</span>
                <span th:text="${book.author}">#저자명</span>
                <span th:text="${book.loan_Date}">#2026-03-25</span>
                <span th:text="${book.return_Date}">#2026-04-01</span>
            </div>
        </div>

        <br>

        <h4 th:inline="text" style="margin-right: 450px; margin-bottom: 10px;">지금까지 빌린 책 목록</h4>
        <div class="all-rent-info">
            <div class="all-rent-header">
                <span>책 제목</span>
                <span>저자명</span>
                <span>대여일</span>
                <span>반납일</span>
            </div>
            <div class="all-rent-row" th:each="history : ${allRentalHistory}">
                <span th:text="${history.title}">#책 제목</span>
                <span th:text="${history.author}">#저자명</span>
                <span th:text="${history.loan_Date}">#대여일</span>
                <span th:text="${history.return_Date}">#반납일</span>
            </div>
        </div>

        <div class="account-actions" style="padding-top: 20px;">
            <a href="/user/delete" class="btn-delete" onclick="return confirm('정말 탈퇴하시겠습니까? 대여 중인 도서 정보가 모두 삭제됩니다.');">
                회원 탈퇴
            </a>
        </div>
    </section>
</body>

</html>
